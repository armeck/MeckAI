    <!-- Anti-flicker Theme Initialization -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('meck_theme_mode') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 dark:bg-[#090d16] dark:text-slate-100 antialiased selection:bg-blue-600/20 selection:text-blue-700 dark:selection:bg-blue-500/30 dark:selection:text-white min-h-screen">
